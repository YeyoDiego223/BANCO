<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in / Sign Up | Nothing4us</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700">
    <link rel="stylesheet" href="registro_login.css">
</head>
<body>
<div class="login-container">
    <form action="" class="form-login">
        <ul class="login-nav">
            <li class="login-nav__item active">
                <a href="#">Sign In</a>
            </li>
            <li class="login-nav__item">
                <a href="#">Sign Up</a>
            </li>
        </ul>
        <label for="login-input-user" class="login__label">
            Username
        </label>
        <input type="text" id="login-input-user" class="login__input">
        <label for="login-input-password" class="login__label">
            Password
        </label>
        <input type="password" id="login-input-password" class="login__input">
        <label for="login-sign-up" class="login__label--checkbox">
            <input type="checkbox" id="login-sign-up" class="login__input--checkbox" />
            Keep me Signed in
        </label>
        <button class="login_submit" disabled>Sign in</button>
    </form>
    <a href="#" class="login__forgot">Forgot Password?</a>
</div>  
</body>
</html>
